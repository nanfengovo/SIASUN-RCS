server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # 1. 开启 Gzip 压缩 (大幅降低 3D 模型与前端包体积)
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/xml text/javascript application/json application/octet-stream;
    gzip_vary on;

    # 2. 托管 Vue 3 静态页面 (History 模式防 404)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 3. 反向代理后端 RESTful API
    location /api/ {
        proxy_pass http://rcs-backend:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 4. 反向代理 SignalR WebSocket 实时遥测管道 (车队 100ms 坐标流长连接)
    location /signalr-hubs/ {
        proxy_pass http://rcs-backend:9000/signalr-hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s; # 保持长连接不断开
    }
}
